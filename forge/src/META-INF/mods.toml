# E3: VERSION is stamped by tools/run-live.sh (@VERSION@ token); the R2
# release guard refuses a hardcoded version here (bump via VERSION= env,
# never source). This file ships in the bridge jar as META-INF/mods.toml.
modLoader="javafml"
loaderVersion="[36,)"
license="MIT"
[[mods]]
modId="matoubridge"
version="@VERSION@"
displayName="MatouBridge"
description="SPI bridge for Minecraft 1.16.5 (SRG-reobfuscated members)."
[[dependencies.matoubridge]]
modId="forge"
mandatory=true
versionRange="[36,)"
ordering="NONE"
side="BOTH"
# E0 registration: the second mod in this jar (hub decisions/REGISTRATION.md)
# owns the example1: prefix it registers, so it is declared under its own
# frozen modid (NAMES.md, never a rename target). Version rides the same
# @VERSION@ stamp (one token, one bump).
[[mods]]
modId="example1"
version="@VERSION@"
displayName="MatouExample1"
description="Example1 content registration for the Matou bridge (generic block + generic beast, spec-driven)."
[[dependencies.example1]]
modId="forge"
mandatory=true
versionRange="[36,)"
ordering="NONE"
side="BOTH"
